[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yelp-recommendation-agent"
version = "0.1.0"
description = "Offline Yelp personalized business recommendation agent MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3,<2",
    "joblib>=1.4,<2",
    "lightgbm>=4.7,<5",
    "numpy>=2.0,<3",
    "openai>=1.100,<2",
    "pandas>=2.2,<3",
    "pyarrow>=20,<26",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "qdrant-client>=1.15,<2",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]
local-embedding = [
    "torch>=2.10,<2.12",
    "transformers>=4.51,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
