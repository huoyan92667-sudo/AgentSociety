services:
  postgres:
    image: postgres:16
    container_name: agent-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-agent}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-agent_dev_password}
    ports:
      - "${AGENT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  agent_postgres_data:

