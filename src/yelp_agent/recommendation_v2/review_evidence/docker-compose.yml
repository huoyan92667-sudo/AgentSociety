services:
  qdrant:
    # 固定版本，避免一次重启就悄悄换了服务端行为。
    image: qdrant/qdrant:v1.18.2
    container_name: recommendation-v2-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # 向量库数据仍放在 recommendation_v2/data 下面，不散落到项目其他位置。
      - ../data/qdrant/v1:/qdrant/storage
